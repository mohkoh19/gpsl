# @package _global_
defaults:
  - override /hydra/sweeper: basic
  - override /hydra/launcher: joblib

hydra:
  mode: MULTIRUN
  launcher:
    n_jobs: 1
  sweeper:
    params:
      seed: 313,72,40,19,7
      # distributed.subset_config.distribution: non_iid,iid
      distributed.sampler._target_: src.utils.sampling.UniformGlobalSampler,src.utils.sampling.LocalFixedSampler,src.utils.sampling.LocalFixedSamplerNonProportional
      distributed.subset_config.params.C: 2,5
      data.batch_size: 64,128,256
      distributed.num_clients: 16,32,64,128