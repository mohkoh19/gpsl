# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: ham10k
  - override /model: gpsl
  - override /distributed: gpsl

tags: ["cifar10", "resnet18", "gpsl"]

trainer:
  min_epochs: 200
  max_epochs: 200

model:
  optimizer:
    _target_: "torch.optim.Adam"
    lr: 0.0001
  model:
    small_imgs: False

distributed:
  subset_config:
    distribution: "non_iid"
    params:
      C: 3
      alpha: 10
